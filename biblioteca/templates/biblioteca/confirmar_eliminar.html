{% extends "web/base_web.html" %}

{% block title %}
Eliminar {{ config.singular }}
{% endblock %}

{% block content %}

<section class="page-section">

    <div class="container">

        <h1>
            Eliminar {{ config.singular }}
        </h1>


        <p>
            ¿Estás seguro de que deseas eliminar este registro?
        </p>


        <div class="card">

            <h3>
                {{ objeto }}
            </h3>

        </div>


        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn"
            >
                Sí, eliminar
            </button>


            <a
                href="{% url 'biblioteca_lista' modelo %}"
                class="btn"
            >
                Cancelar
            </a>

        </form>

    </div>

</section>

{% endblock %}
