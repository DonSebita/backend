{% extends "estudiantes/base_estudiantes.html" %}

{% block title %}
    Crear Estudiante
{% endblock %}

{% block content %}

<section class="page-section">

    <div class="container">

        <h1>Nuevo Estudiante</h1>

        <p>
            Ingresa los datos del nuevo estudiante.
        </p>


        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <!-- Nombre -->

                <div class="form-group">

                    <label for="titulo">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ej: Sebastian"
                        maxlength="20"
                        required
                    >

                </div>


                <!-- APELLIDO -->

                <div class="form-group">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        placeholder="Ej: Pérez"
                        maxlength="100"
                        required
                    >

                </div>


                <!-- SALON -->

                <div class="form-group">

                    <label for="salon">
                        Salón
                    </label>

                    <select
                        id="salon"
                        name="salon"
                        required
                    >

                        <option value="">
                            Selecciona un salón
                        </option>

                        {% for salon in salones %}

                        <option value="{{ salon.id_salon }}">
                            {{ salon.id_salon }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- CLASES -->

                <div class="form-group">

                    <label for="clases">
                        Clases
                    </label>

                    <select
                        id="clases"
                        name="clases"
                        multiple
                    >

                        {% for clase in clases %}

                        <option value="{{ clase.id }}">
                            {{ clase.nombre_clase }}
                        </option>

                        {% endfor %}

                    </select>

                    <small>
                        Mantén presionado Ctrl para seleccionar
                        varias clases.
                    </small>

                </div>


                <!-- BOTONES -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Crear estudiante
                    </button>

                    <a
                        href="{% url 'lista_estudiantes' %}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
