{% extends "estudiantes/base_estudiantes.html" %}

{% block title %}
    Crear Salón
{% endblock %}

{% block content %}

<section class="page-section">

    <div class="container">

        <h1>Nuevo Salón</h1>

        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="id_salon">
                        Número de Salón
                    </label>

                    <input
                        type="number"
                        id="id_salon"
                        name="id_salon"
                        placeholder="Ej: 101"
                        required
                    >

                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Guardar
                    </button>

                    <a
                        href="{% url 'lista_salones' %}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
