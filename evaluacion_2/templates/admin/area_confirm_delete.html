{% extends 'base.html' %}
{% block title %}Eliminar área | EdTech Admin{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-6 py-12">
    <div class="bg-slate-900 border border-red-800 rounded-2xl p-8 text-center">
        <div class="text-5xl mb-4">⚠️</div>
        <h1 class="text-2xl font-extrabold">¿Eliminar esta área?</h1>
        <p class="text-slate-400 mt-2">Se eliminarán todos los cursos asociados. Esta acción no se puede deshacer.</p>
        <p class="mt-4 text-lg font-semibold text-indigo-300">{{ area.name }}</p>
        <div class="flex justify-center gap-4 mt-8">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="bg-red-600 hover:bg-red-500 px-6 py-3 rounded-lg font-semibold">
                    Sí, eliminar
                </button>
            </form>
            <a href="{% url 'admin_areas' %}" class="bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-lg font-semibold">
                Cancelar
            </a>
        </div>
    </div>
</section>
{% endblock %}
