{% extends 'base.html' %}

{% block title %}
Ingresar | EdTech
{% endblock %}

{% block content %}

<section class="min-h-[75vh] flex items-center justify-center px-6 py-16">

  <div class="w-full max-w-md">

    <div class="text-center mb-8">

      <h1 class="text-3xl font-extrabold">
        Bienvenido de nuevo
      </h1>

      <p class="text-slate-500 mt-2">
        Ingresa a tu cuenta para continuar aprendiendo.
      </p>

    </div>


    <div class="bg-slate-900
                    border border-slate-800
                    rounded-2xl
                    p-8
                    shadow-xl">

      <form method="POST">

        {% csrf_token %}


        {% if error %}
        <div class="mb-5 p-4 rounded-lg
                            bg-red-500/10
                            border border-red-500/20
                            text-red-400">

          {{ error }}

        </div>
        {% endif %}


        <div class="mb-5">

          <label class="block text-sm font-medium mb-2">
            Usuario
          </label>

          <input type="text" name="username" required class="w-full bg-slate-950
                               border border-slate-700
                               rounded-lg px-4 py-3
                               outline-none
                               focus:border-indigo-500
                               transition" placeholder="Tu usuario">

        </div>


        <div class="mb-6">

          <label class="block text-sm font-medium mb-2">
            Contraseña
          </label>

          <input type="password" name="password" required class="w-full bg-slate-950
                               border border-slate-700
                               rounded-lg px-4 py-3
                               outline-none
                               focus:border-indigo-500
                               transition" placeholder="••••••••">

        </div>


        <button type="submit" class="w-full bg-indigo-600
                           hover:bg-indigo-500
                           py-3 rounded-lg
                           font-semibold
                           transition">

          Ingresar

        </button>

      </form>


      <div class="text-center mt-6
                        text-sm text-slate-500">

        ¿No tienes una cuenta?

        <a href="/register/" class="text-indigo-400
                          hover:text-indigo-300">

          Regístrate

        </a>

      </div>

    </div>

  </div>

</section>

{% endblock %}
