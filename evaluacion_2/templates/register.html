{% extends 'base.html' %}

{% block title %}
Crear cuenta | EdTech
{% endblock %}

{% block content %}

<section class="min-h-[75vh]
                flex items-center justify-center
                px-6 py-16">

  <div class="w-full max-w-md">

    <div class="text-center mb-8">

      <h1 class="text-3xl font-extrabold">
        Crea tu cuenta
      </h1>

      <p class="text-slate-500 mt-2">
        Comienza tu camino de aprendizaje.
      </p>

    </div>


    <div class="bg-slate-900
                    border border-slate-800
                    rounded-2xl
                    p-8 shadow-xl">

      <form method="POST">

        {% csrf_token %}


        {% if error %}

        <div class="mb-5 p-4 rounded-lg
                            bg-red-500/10
                            border border-red-500/20
                            text-red-400">

          {{ error }}

        </div>

        {% endif %}


        <div class="mb-5">

          <label class="block text-sm font-medium mb-2">
            Usuario
          </label>

          <input type="text" name="username" required class="w-full bg-slate-950
                               border border-slate-700
                               rounded-lg px-4 py-3
                               focus:border-indigo-500
                               outline-none">

        </div>


        <div class="mb-5">

          <label class="block text-sm font-medium mb-2">
            Correo electrónico
          </label>

          <input type="email" name="email" required class="w-full bg-slate-950
                               border border-slate-700
                               rounded-lg px-4 py-3
                               focus:border-indigo-500
                               outline-none">

        </div>


        <div class="mb-5">

          <label class="block text-sm font-medium mb-2">
            Contraseña
          </label>

          <input type="password" name="password" required class="w-full bg-slate-950
                               border border-slate-700
                               rounded-lg px-4 py-3
                               focus:border-indigo-500
                               outline-none">

        </div>


        <div class="mb-6">

          <label class="block text-sm font-medium mb-2">
            Repetir contraseña
          </label>

          <input type="password" name="password2" required class="w-full bg-slate-950
                               border border-slate-700
                               rounded-lg px-4 py-3
                               focus:border-indigo-500
                               outline-none">

        </div>


        <button type="submit" class="w-full bg-indigo-600
                           hover:bg-indigo-500
                           py-3 rounded-lg
                           font-semibold">

          Crear cuenta

        </button>

      </form>


      <p class="text-center text-sm
                      text-slate-500 mt-6">

        ¿Ya tienes una cuenta?

        <a href="/login/" class="text-indigo-400">

          Ingresar

        </a>

      </p>

    </div>

  </div>

</section>

{% endblock %}
