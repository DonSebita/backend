{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* Sobrescribimos el container solo para esta vista para que ocupe todo el ancho */
    .container { max-width: 100%; padding: 0; margin: 0; }
    
    .split-layout {
        display: flex;
        min-height: calc(100vh - 80px); /* Resta la altura del nav */
    }
    
    .split-left {
        flex: 1;
        background-image: url('{% static "img/aw.webp" %}');
        background-size: cover;
        background-position: center;
    }
    
    .split-right {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-crema);
    }
    
    .form-wrapper {
        width: 100%;
        max-width: 400px;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--verde-oscuro); }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #EAE5D9; border-radius: 25px; box-sizing: border-box; }
    
    .toggle-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--verde-claro);
        cursor: pointer;
        font-weight: bold;
    }
    .toggle-link:hover { color: var(--verde-oscuro); }
    
    .hidden { display: none !important; }
</style>

<div class="split-layout">
    <!-- Mitad Izquierda: Imagen de la Planta -->
    <div class="split-left"></div>

    <!-- Mitad Derecha: Formularios -->
    <div class="split-right">
        <div class="form-wrapper">
            
            <!-- FORMULARIO DE LOGIN -->
            <div id="panel-login">
                <h2 style="color: var(--verde-oscuro); margin-top: 0;">Welcome Back</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Sign In</button>
                </form>
                <p id="login-msg" style="color:red; text-align:center;"></p>
                <span class="toggle-link" onclick="toggleForms()">Don't have an account? Create one</span>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <div id="panel-register" class="hidden">
                <h2 style="color: var(--verde-oscuro); margin-top: 0;">Join Us</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="reg-nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="reg-apellido" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Create Account</button>
                </form>
                <p id="reg-msg" style="color:red; text-align:center;"></p>
                <span class="toggle-link" onclick="toggleForms()">Already have an account? Sign In</span>
            </div>

        </div>
    </div>
</div>

<script>
    // Alternar entre Login y Registro
    function toggleForms() {
        document.getElementById('panel-login').classList.toggle('hidden');
        document.getElementById('panel-register').classList.toggle('hidden');
        document.getElementById('login-msg').innerText = '';
        document.getElementById('reg-msg').innerText = '';
    }

    // Lógica de Inicio de Sesión
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const response = await fetch('/api/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: document.getElementById('login-email').value, 
                password: document.getElementById('login-password').value 
            })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            
            // Redirección condicional basada en el rol
            if (data.rol === 'admin') {
                window.location.href = '/admin-dashboard/';
            } else {
                window.location.href = '/perfil/';
            }
        } else {
            document.getElementById('login-msg').innerText = 'Credenciales incorrectas.';
        }
    });

    // Lógica de Registro
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const response = await fetch('/api/registro/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                nombre: document.getElementById('reg-nombre').value,
                apellido: document.getElementById('reg-apellido').value,
                email: document.getElementById('reg-email').value, 
                password: document.getElementById('reg-password').value 
            })
        });

        if (response.ok) {
            alert('Cuenta creada exitosamente. Por favor, inicia sesión.');
            toggleForms(); // Volver al login
        } else {
            const data = await response.json();
            document.getElementById('reg-msg').innerText = data.error || 'Error al registrar.';
        }
    });
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('registro') === 'true') {
            toggleForms();
        }
    });
    
</script>
{% endblock %}
