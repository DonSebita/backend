<div class="dashboard-card" id="seccion-perfil">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h2 style="color: var(--verde-oscuro); margin-top: 0;">Detalles Personales</h2>
            <p style="color: #6B7280; margin-bottom: 30px;">Actualiza tu información. Haz doble clic en una casilla para editarla.</p>
        </div>
        <button type="button" class="btn-outline" onclick="habilitarEdicion()">Modificar Datos</button>
    </div>
    
    <form id="form-perfil">
        <div class="form-grid">
            <div class="form-group">
                <label style="font-weight: bold; color: var(--verde-oscuro);">Nombre Completo</label>
                <input type="text" id="perfil-nombre" class="form-control" placeholder="Ej. Juan Pérez" readonly ondblclick="habilitarCampo(this)">
            </div>
            <div class="form-group">
                <label style="font-weight: bold; color: var(--verde-oscuro);">Correo Electrónico</label>
                <input type="email" id="perfil-email" class="form-control" placeholder="tucorreo@ejemplo.com" readonly title="El correo no se puede modificar">
            </div>
            <div class="form-group">
                <label style="font-weight: bold; color: var(--verde-oscuro);">Teléfono</label>
                <input type="text" id="perfil-telefono" class="form-control" placeholder="Ej. +56912345678" readonly ondblclick="habilitarCampo(this)">
            </div>
            <div class="form-group">
                <label style="font-weight: bold; color: var(--verde-oscuro);">RUT</label>
                <input type="text" id="perfil-rut" class="form-control" placeholder="Ej. 12345678-9" readonly ondblclick="habilitarCampo(this)">
            </div>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
            <button type="submit" class="btn" id="btn-guardar-perfil" style="display: none;">Guardar Cambios</button>
            <button type="button" class="btn-danger" onclick="eliminarCuenta()">Eliminar Cuenta</button>
        </div>
    </form>
</div>
