{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda de Plantas</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2.0">
</head>
<body>
    <nav>
        <!-- Lado Izquierdo -->
        <div class="nav-seccion">
            <a href="/">Inicio</a>
        </div>
        
        <!-- Lado Derecho -->
        <div class="nav-seccion">
            <!-- Grupo Visitantes -->
            <div id="nav-guest" style="display:flex; gap:15px; align-items:center;">
                <a href="{% url 'web_login' %}" class="btn-outline">Iniciar Sesión</a>
                <a href="{% url 'web_login' %}?registro=true" class="btn">Registrarse</a> 
            </div>
            
            <!-- Grupo Usuarios Logueados -->
            <div id="nav-auth" style="display:none; gap:15px; align-items:center;">
                <!-- Usamos IDs dinámicos para cambiar el texto y enlace según el rol -->
                <a href="{% url 'web_perfil' %}" id="nav-enlace-usuario">
                    <img src="{% static 'img/icon.png' %}" alt="Foto de perfil" class="nav-profile-img">
                    <span id="nav-texto-usuario">Mi Perfil</span>
                </a>
                <a href="#" onclick="cerrarSesion()" class="btn-outline">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
    
    <!-- Espacio para banners especiales (como el del home) -->
    {% block hero %}{% endblock %}

    <!-- CONTENEDOR PRINCIPAL: Aquí se carga el contenido de las demás páginas -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Lógica para mostrar los botones correctos y verificar roles
        const token = localStorage.getItem('access_token');
        const rol = localStorage.getItem('user_rol'); // <-- Leemos el rol guardado
        
        if (token) {
            document.getElementById('nav-guest').style.display = 'none';
            document.getElementById('nav-auth').style.display = 'flex';

            // Si el usuario es administrador, vendedor o bodeguero
            if (rol === 'admin' || rol === 'vendedor' || rol === 'bodeguero') {
                const enlaceUsuario = document.getElementById('nav-enlace-usuario');
                enlaceUsuario.href = "{% url 'web_admin_dashboard' %}";
                document.getElementById('nav-texto-usuario').innerText = "Dashboard";
            }

            try {
                // Lógica opcional para la expiración automática del token
                const payload = JSON.parse(atob(token.split('.')[1]));
                const tiempoExpiracion = payload.exp * 1000;
                const tiempoRestante = tiempoExpiracion - Date.now();

                if (tiempoRestante <= 0) {
                    cerrarSesion();
                } else {
                    setTimeout(() => {
                        alert("Tu sesión ha expirado por seguridad. Vuelve a iniciar sesión.");
                        cerrarSesion();
                    }, tiempoRestante);
                }
            } catch (error) {
                cerrarSesion();
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user_rol'); // <-- Limpiamos el rol al cerrar sesión
            window.location.href = "{% url 'web_login' %}";
        }
    </script>
</body>
</html>
